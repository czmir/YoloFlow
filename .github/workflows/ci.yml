name: ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps (CPU torch)
        run: |
          python -m pip install -U pip
          pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Pytest
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          YOLO_AUTOINSTALL: "false"
        run: pytest -q --tb=short
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Boot clean Compose stack
        run: docker compose up --build -d
      - name: Verify API, worker and frontend proxy
        run: |
          curl --fail --retry 15 --retry-delay 2 --retry-all-errors http://127.0.0.1:8000/health
          curl --fail http://127.0.0.1:5173/
          curl --fail http://127.0.0.1:5173/api/v1/training/jobs | jq -e 'type == "array"'
          docker compose ps --status running --services | grep -Fx worker
      - name: Capture service logs
        if: always()
        run: docker compose logs --no-color
