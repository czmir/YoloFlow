services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - YOLOFLOW_DATABASE_URL=sqlite:////app/data/yoloflow.db
      - YOLOFLOW_EMBEDDED_WORKER=false
      - YOLOFLOW_WORKER_NAME=api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.worker
    volumes:
      - ./data:/app/data
    depends_on:
      - api
    environment:
      - YOLOFLOW_DATABASE_URL=sqlite:////app/data/yoloflow.db
      - YOLOFLOW_EMBEDDED_WORKER=false
      - YOLOFLOW_WORKER_NAME=standalone
    command: python worker/main.py

  ort-inference:
    profiles: ["ort"]
    build:
      context: .
      dockerfile: deploy/Dockerfile.ort
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./data:/app/data
    environment:
      - YOLOFLOW_ORT_MODEL=${YOLOFLOW_ORT_MODEL:-/app/data/models/model.onnx}
    command: python deploy/ort_server/main.py

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api
