services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - YOLOFLOW_DATABASE_URL=sqlite:////app/data/yoloflow.db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.worker
    volumes:
      - ./data:/app/data
    depends_on:
      - api
    command: python worker/main.py

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    ports:
      - "5173:5173"
    depends_on:
      - api